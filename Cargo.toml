[package]
name = "freeway-player"
version = "0.1.10"
edition = "2021"
description = "Reproductor de música para Linux con Raven y rodio"
license = "MIT"

[[bin]]
name = "freeway-player"
path = "src/main.rs"

[dependencies]
raven = { package = "raven-gui", path = "vendor/raven-gui" }
cpal = { version = "0.18.2", features = ["pulseaudio"] }
rodio = { version = "0.23.0", default-features = false, features = ["playback", "flac", "mp3", "mp4", "vorbis", "wav"] }
symphonia = { version = "0.5.5", default-features = false, features = ["flac", "ogg", "vorbis"] }
symphonia-adapter-libopus = "0.2.9"
lofty = "0.25.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
ashpd = { version = "0.14", features = ["flatpak"] }
futures-util = "0.3"
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
tokio = { version = "1", features = ["rt", "time"] }
ureq = { version = "3", features = ["json"] }
