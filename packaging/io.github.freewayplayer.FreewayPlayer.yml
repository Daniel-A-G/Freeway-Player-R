id: io.github.freewayplayer.FreewayPlayer
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: freeway-player
finish-args:
  - --share=ipc
  - --share=network
  # Raven se compila con RAVEN_PLATFORM=x11; exponer el socket Wayland hace
  # que el DND de archivos falle en algunos escritorios Wayland/KDE.
  - --socket=x11
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=home
  - --filesystem=/run/media
  - --env=FREEWAY_UI_FILE=/app/share/freeway-player/ui/main.xml
  - --env=LD_LIBRARY_PATH=/app/lib
modules:
  - name: vulkan-headers
    buildsystem: simple
    build-commands:
      - install -d /app/include
      - cp -R include/vulkan /app/include/
    sources:
      - type: git
        url: https://github.com/KhronosGroup/Vulkan-Headers.git
        tag: v1.3.290
  - name: raven
    buildsystem: simple
    build-commands:
      - cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/app -DCMAKE_INSTALL_LIBDIR=lib -DRAVEN_BUILD_SHARED=ON -DRAVEN_BUILD_EXAMPLES=OFF -DRAVEN_BUILD_TESTS=OFF -DRAVEN_BUILD_TOOLS=OFF -DRAVEN_BUILD_WEB=OFF -DRAVEN_PLATFORM=x11 -DRAVEN_VULKAN_INCLUDE_DIR=/app/include -DRAVEN_FETCH_VULKAN_HEADERS=OFF
      - cmake --build build --parallel
      - cmake --install build
    sources:
      - type: git
        url: https://github.com/oscar-soirey/Raven.git
        tag: v0.2.1
  # yt-dlp se instala como zipapp. Dentro del sandbox el PATH es
  # /app/bin:/usr/bin, así que no puede usar una herramienta instalada en el
  # host. El runtime Freedesktop 25.08 ya aporta Python 3.13 y ffmpeg con
  # libopus y HTTPS. La versión queda fijada: si YouTube rompe el extractor
  # habrá que subirla y publicar una nueva versión de la app.
  - name: yt-dlp
    buildsystem: simple
    build-commands:
      - install -Dm755 yt-dlp /app/bin/yt-dlp
      - install -Dm644 LICENSE /app/share/licenses/io.github.freewayplayer.FreewayPlayer/yt-dlp-LICENSE
      - install -Dm644 THIRD_PARTY_LICENSES.txt /app/share/licenses/io.github.freewayplayer.FreewayPlayer/yt-dlp-THIRD_PARTY_LICENSES.txt
    sources:
      - type: file
        url: https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.26/yt-dlp
        sha256: e51e69e89489f199530f13d32a4342da3ddb2cf34842f364603a066db05afbf3
      - type: file
        url: https://raw.githubusercontent.com/yt-dlp/yt-dlp/2026.10.26/LICENSE
        sha256: 7e12e5df4bae12cb21581ba157ced20e1986a0508dd10d0e8a4ab9a4cf94e85c
      - type: file
        url: https://raw.githubusercontent.com/yt-dlp/yt-dlp/2026.10.26/THIRD_PARTY_LICENSES.txt
        sha256: 472aefe951c7db35e1657c1d13fd337140511ed6f2b329205105ad441c5a02b7
  - name: freeway-player
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/freeway-player/cargo
      # Needed for this first local manifest: cargo resolves and fetches crates
      # while building. Flathub builds should use a Cargo.lock plus generated
      # cargo-sources.json and remove this network permission.
      build-args:
        - --share=network
    build-commands:
      - RAVEN_LIB_DIR=/app/lib cargo build --release
      - install -Dm755 target/release/freeway-player /app/bin/freeway-player
      - install -Dm644 ui/main.xml /app/share/freeway-player/ui/main.xml
      - install -Dm644 data/io.github.freewayplayer.FreewayPlayer.desktop /app/share/applications/io.github.freewayplayer.FreewayPlayer.desktop
      - install -Dm644 icon.png /app/share/icons/hicolor/256x256/apps/io.github.freewayplayer.FreewayPlayer.png
      - install -Dm644 data/fonts/LICENSE-Noto.txt /app/share/licenses/io.github.freewayplayer.FreewayPlayer/LICENSE-Noto.txt
    sources:
      - type: dir
        path: ..
        skip:
          - .flatpak-builder
          - .github
          - .git
          - .local
          - build-dir
          - dist
          - repo
          - target
          - freeway-player.flatpak
