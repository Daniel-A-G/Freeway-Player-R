name: Flatpak release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-and-release:
    name: Build, publish Flatpak repository, and release
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: https://daniel-a-g.github.io/Freeway-Player-R/
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y flatpak flatpak-builder elfutils gnupg

      - name: Add Flathub remote
        run: flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Check release tag against Cargo version
        id: app-version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(awk -F '"' '$1 ~ /^version[[:space:]]*=/ { print $2; exit }' Cargo.toml)"
          if [[ -z "$app_version" || "$tag_version" != "$app_version" ]]; then
            echo "Tag $GITHUB_REF_NAME must match Cargo.toml version ($app_version), for example v$app_version." >&2
            exit 1
          fi
          printf 'version=%s\n' "$app_version" >> "$GITHUB_OUTPUT"

      - name: Build Flatpak repository
        run: >-
          flatpak-builder --user --install-deps-from=flathub --force-clean
          --delete-build-dirs --repo=repo --default-branch=stable build-dir
          packaging/io.github.freewayplayer.FreewayPlayer.yml

      - name: Sign repository and create installable bundle
        env:
          APP_VERSION: ${{ steps.app-version.outputs.version }}
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          FLATPAK_GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$FLATPAK_GPG_PRIVATE_KEY" || -z "$FLATPAK_GPG_KEY_ID" ]]; then
            echo "Configure FLATPAK_GPG_PRIVATE_KEY and FLATPAK_GPG_KEY_ID in repository Actions secrets." >&2
            exit 1
          fi

          export GNUPGHOME="$RUNNER_TEMP/flatpak-gnupg"
          install -d -m 700 "$GNUPGHOME"
          printf '%s' "$FLATPAK_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --export "$FLATPAK_GPG_KEY_ID" > "$RUNNER_TEMP/freeway-player-public.gpg"
          if [[ ! -s "$RUNNER_TEMP/freeway-player-public.gpg" ]]; then
            echo "FLATPAK_GPG_KEY_ID does not identify the imported signing key." >&2
            exit 1
          fi

          flatpak build-sign --gpg-sign="$FLATPAK_GPG_KEY_ID" repo io.github.freewayplayer.FreewayPlayer stable
          flatpak build-update-repo --gpg-sign="$FLATPAK_GPG_KEY_ID" --generate-static-deltas --prune repo

          repo_url="https://daniel-a-g.github.io/Freeway-Player-R/"
          runtime_repo="https://dl.flathub.org/repo/flathub.flatpakrepo"
          public_key="$(base64 --wrap=0 "$RUNNER_TEMP/freeway-player-public.gpg")"
          cat > repo/io.github.freewayplayer.FreewayPlayer.flatpakref <<EOF
          [Flatpak Ref]
          Name=io.github.freewayplayer.FreewayPlayer
          Branch=stable
          Title=Freeway Player
          Url=$repo_url
          IsRuntime=false
          RuntimeRepo=$runtime_repo
          SuggestRemoteName=freeway-player
          GPGKey=$public_key
          EOF
          cat > repo/freeway-player.flatpakrepo <<EOF
          [Flatpak Repo]
          Version=1
          Title=Freeway Player
          Url=$repo_url
          Homepage=https://github.com/Daniel-A-G/Freeway-Player-R
          Comment=Repositorio oficial de Freeway Player
          Description=Actualizaciones de Freeway Player para Flatpak.
          GPGKey=$public_key
          DefaultBranch=stable
          EOF
          cat > repo/index.html <<'EOF'
          <!doctype html>
          <html lang="es">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Freeway Player — Flatpak</title>
          <h1>Freeway Player</h1>
          <p>Repositorio oficial de Flatpak para instalar y actualizar Freeway Player.</p>
          <p><a href="freeway-player.flatpakrepo">Añadir el repositorio</a> · <a href="io.github.freewayplayer.FreewayPlayer.flatpakref">Instalar Freeway Player</a></p>
          <p><a href="https://github.com/Daniel-A-G/Freeway-Player-R/releases">Ver releases</a></p>
          </html>
          EOF

          mkdir -p dist
          asset="freeway-player-${GITHUB_REF_NAME}-x86_64.flatpak"
          flatpak build-bundle repo "dist/$asset" io.github.freewayplayer.FreewayPlayer stable \
            --repo-url="$repo_url" \
            --gpg-keys="$RUNNER_TEMP/freeway-player-public.gpg" \
            --runtime-repo="$runtime_repo"
          (
            cd dist
            sha256sum "$asset" > "$asset.sha256"
          )
          cat > dist/BUILD-INFO.txt <<EOF
          release_tag=$GITHUB_REF_NAME
          cargo_version=$APP_VERSION
          commit=$GITHUB_SHA
          architecture=x86_64
          flatpak_id=io.github.freewayplayer.FreewayPlayer
          flatpak_branch=stable
          flatpak_repository=$repo_url
          runtime=org.freedesktop.Platform//25.08
          EOF

      - name: Upload Flatpak repository to GitHub Pages
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: repo

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          repo="$GITHUB_REPOSITORY"
          asset="dist/freeway-player-${tag}-x86_64.flatpak"
          assets=("$asset" "$asset.sha256" dist/BUILD-INFO.txt)
          release_options=(
            --repo "$repo"
            --title "Freeway Player $tag"
            --generate-notes
            --verify-tag
          )
          if [[ "$tag" == *-* ]]; then
            release_options+=(--prerelease)
          fi
          gh release create "$tag" "${assets[@]}" "${release_options[@]}"
